<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — Settings — Custom Formats</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <p class="settings-subtitle">Score and tag releases based on properties like audio tracks, subtitles, or encode source.</p>

    <div id="customFormatsRoot"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/settings-custom-formats.js"></script>
