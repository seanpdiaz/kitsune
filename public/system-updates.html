<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — System — Updates</title>
<script src="js/sidebar-boot.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">System</h1>
      </div>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">Current build, update status, and what's changed since.</p>

    <!-- Real now (see README's "React migration" section) — public/dist/
         system-updates.js, built from frontend/pages/system-updates/,
         mounts into this one div and owns the whole subtree, same shape
         system-status.html's #statusRoot already uses. Used to be four
         hardcoded settings-card blocks of made-up version history; see
         server/lib/update-check.js for what actually backs this now. -->
    <div id="updatesRoot"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/system-updates.js"></script>
</body>
</html>
