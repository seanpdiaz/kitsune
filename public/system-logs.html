<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — System — Logs</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">System</h1>
      </div>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">Application log output, filterable by level.</p>

    <!-- Both React now (see README's "React migration" section) — one
         component/state (the currently-selected level) drives both the
         tab strip (portaled into logFilterTabsRoot) and the list below. -->
    <div class="filter-row" style="margin-bottom: 14px;">
      <div class="tabs" id="logFilterTabsRoot"></div>
    </div>

    <div class="log-header">
      <span>Time</span><span>Level</span><span>Logger</span><span>Message</span>
    </div>
    <div id="logList"></div>

    <div class="settings-card" style="margin-top: 20px;">
      <h2>Log Files</h2>
      <p class="card-desc">Rotated log files kept on disk.</p>
      <div class="settings-header" style="grid-template-columns: 1fr 100px 160px 32px;">
        <span>File</span><span>Size</span><span>Modified</span><span></span>
      </div>
      <div class="settings-row" style="grid-template-columns: 1fr 100px 160px 32px;">
        <span class="settings-title">kitsune.txt</span>
        <span class="settings-meta">2.1 MB</span>
        <span class="settings-meta">Just now</span>
        <button class="ep-action" type="button" aria-label="Download kitsune.txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
      </div>
      <div class="settings-row" style="grid-template-columns: 1fr 100px 160px 32px;">
        <span class="settings-title">kitsune.1.txt</span>
        <span class="settings-meta">2.4 MB</span>
        <span class="settings-meta">1 day ago</span>
        <button class="ep-action" type="button" aria-label="Download kitsune.1.txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
      </div>
      <div class="settings-row" style="grid-template-columns: 1fr 100px 160px 32px;">
        <span class="settings-title">kitsune.2.txt</span>
        <span class="settings-meta">2.3 MB</span>
        <span class="settings-meta">2 days ago</span>
        <button class="ep-action" type="button" aria-label="Download kitsune.2.txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
      </div>
    </div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/system-logs.js"></script>
</body>
</html>
