<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — System — Tasks</title>
<script src="js/sidebar-boot.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">System</h1>
      </div>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">Scheduled background jobs Kitsune runs automatically.</p>

    <div class="task-header">
      <span>Name</span><span>Interval</span><span>Last Run</span><span>Next Run</span><span></span>
    </div>
    <div id="taskList"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<!-- The task list itself is React now (see README's "React migration"
     section) — app.js above still handles the sidebar/page-tabs (nav.js)
     and every other still-unmigrated page's script, same as always; this
     is the one additional bundle, built from frontend/pages/system-tasks/
     via `npm run build`, that renders into #taskList. -->
<script type="module" src="dist/system-tasks.js"></script>
</body>
</html>
