<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — Activity — History</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">Activity</h1>
      </div>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">A record of grabs, imports, failures, and removals.</p>

    <!-- Both React now (see README's "React migration" section) — one
         component/state drives the tab strip (portaled into
         historyFilterTabsRoot) and the list below. -->
    <div class="filter-row" style="margin-bottom: 14px;">
      <div class="tabs" id="historyFilterTabsRoot"></div>
    </div>

    <div class="event-header">
      <span>Time</span><span>Type</span><span>Message</span>
    </div>
    <div id="historyList"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/activity-history.js"></script>
</body>
</html>
