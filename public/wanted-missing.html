<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — Wanted — Missing</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">Wanted</h1>
      </div>
      <!-- React now (see README's "React migration" section) — rendered
           via a portal from the same component/state as #missingList below. -->
      <span id="missingSearchAllBtnRoot"></span>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">Episodes that have aired but haven't been downloaded yet.</p>

    <div class="missing-header">
      <span>Series</span><span>Episode</span><span>Air Date</span><span></span>
    </div>
    <div id="missingList"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/wanted-missing.js"></script>
</body>
</html>
