<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitsune — System — Backup</title>
<script src="js/sidebar-boot.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="top-row">
      <div>
        <h1 class="settings-heading">System</h1>
      </div>
      <!-- The button itself is React now (see README's "React migration"
           section), rendered via a portal from the same component/state as
           #backupList below so "Backup Now" can prepend a real row to that
           list — this placeholder is just where it mounts. -->
      <span id="backupNowBtnRoot"></span>
    </div>

    <div class="page-tabs"></div>
    <p class="settings-subtitle">Back up Kitsune's database and download the file — restoring isn't available yet.</p>

    <div class="backup-header">
      <span>Type</span><span>Filename</span><span>Size</span><span>Date</span><span></span><span></span>
    </div>
    <div id="backupList"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="dist/system-backup.js"></script>
</body>
</html>
